<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="theme-color" content="#ffffff"/><script>
(()=>{try{
 const saved=localStorage.getItem('nutricarsi-theme');
 const selected=saved==='light'||saved==='dark'||saved==='system'?saved:'system';
 const dark=selected==='dark'||(selected==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);
 document.documentElement.dataset.theme=dark?'dark':'light';
 document.documentElement.style.colorScheme=dark?'dark':'light';
 document.querySelector('meta[name="theme-color"]')?.setAttribute('content',dark?'#111b16':'#ffffff');
}catch{document.documentElement.dataset.theme='light';}})();
</script><meta name="description" content="Acesse seu espaço de atendimento nutricional."/><title>NutriCarsi | SistemaNutri CarsiGPT</title><link rel="icon" href="/favicon.svg"/></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
