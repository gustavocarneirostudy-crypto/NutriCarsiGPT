name: Frontend security checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  security-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate public environment policy
        run: npm run test:security
      - name: Compile and build without real credentials
        run: npm run build
        env:
          VITE_NEON_AUTH_URL: https://auth.example.com
          VITE_NEON_DATA_API_URL: https://data.example.com
